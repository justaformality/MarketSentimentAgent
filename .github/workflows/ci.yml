name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # llm_summary.py constructs the OpenAI client at import time, which raises
      # if no key is set. Every OpenAI call in the tests is mocked, so a
      # placeholder is enough. This is NOT a secret.
      OPENAI_API_KEY: placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v --cov=. --cov-report=term-missing
